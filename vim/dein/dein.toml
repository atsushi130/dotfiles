# プラグインマネージャ
[[plugins]]
repo = 'Shougo/dein.vim'

# 補完 - Modern LSP-based completion
[[plugins]]
repo = 'neoclide/coc.nvim'
rev = 'release'
hook_add = 'source ~/.vim/dein/plugins/coc.vim'

[[plugins]]
repo = 'junegunn/fzf'
hook_add = 'source ~/.vim/dein/plugins/fzf.vim'

# "" や () をインサートし易くする
[[plugins]]
repo = 'tpope/vim-surround'

# スニペット
[[plugins]]
repo = 'Shougo/neosnippet'
hook_add = 'source ~/.vim/dein/plugins/neosnippet.vim'

[[plugins]]
repo = 'Shougo/neosnippet-snippets'

# ディレクトリツリー表示 - Modern alternative
[[plugins]]
repo = 'nvim-tree/nvim-tree.lua'
hook_add = 'source ~/.vim/dein/plugins/nvim-tree.vim'

# ステータスバーの表示
[[plugins]]
repo = 'atsushi130/lightline.vim'
rev  = 'master'
hook_add = 'source ~/.vim/dein/plugins/lightline.vim'

# Linting and fixing - Modern alternative to syntastic
[[plugins]]
repo = 'dense-analysis/ale'
hook_add = 'source ~/.vim/dein/plugins/ale.vim'

# 閉じ括弧の自動挿入
[[plugins]]
repo = 'kana/vim-smartinput'

# JavaScript/TypeScript support
[[plugins]]
repo = 'pangloss/vim-javascript'

[[plugins]]
repo = 'maxmellon/vim-jsx-pretty'

[[plugins]]
repo = 'leafgarland/typescript-vim'
on_ft = 'typescript'

[[plugins]]
repo = 'peitalin/vim-jsx-typescript'

# Rust のシンタックスチェック
[[plugins]]
repo = 'rust-lang/rust.vim'
hook_add = 'source ~/.vim/dein/plugins/rust.vim'

# tags自動更新
[[plugins]]
repo = 'ludovicchabant/vim-gutentags'

# tagbar メソッドリスト
[[plugins]]
repo = 'preservim/tagbar'
hook_add = 'source ~/.vim/dein/plugins/tagbar.vim'

# 異なるエディタで設定を共有
[[plugins]]
repo = 'editorconfig/editorconfig-vim'

# Markdown プラグイン
[[plugins]]
repo = 'plasticboy/vim-markdown'
hook_add = 'source ~/.vim/dein/plugins/vim-markdown.vim'

# Markdown プレビュー
[[plugins]]
repo = 'iamcco/markdown-preview.nvim'
hook_add = 'source ~/.vim/dein/plugins/markdown-preview.vim'

# ブラウザ自動同期
[[plugins]]
repo = 'tyru/open-browser.vim'

# Git integration
[[plugins]]
repo = 'tpope/vim-fugitive'

[[plugins]]
repo = 'airblade/vim-gitgutter'

# Modern colorschemes
[[plugins]]
repo = 'joshdick/onedark.vim'

[[plugins]]
repo = 'folke/tokyonight.nvim'
